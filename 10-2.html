<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin: 0; padding: 0;}
        h2{ text-align: center; margin-top: 20px; }
        .slides{
            position: relative;
            width: 600px;
            height: 460px;
            margin: 20px auto;
        }
        /* 三张幻灯片叠放在一起，通过透明度动画轮流显示 */
        .slide{
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            opacity: 0;
            /* 每张图一个周期9秒：淡入-停留-淡出 */
            animation: fade 9s infinite;
        }
        .slide:nth-child(1){ animation-delay: 0s; }
        .slide:nth-child(2){ animation-delay: 3s; }
        .slide:nth-child(3){ animation-delay: 6s; }
        /* 文字覆盖在图片底部 */
        .slide img{
            display: block;
            width: 100%;
            height: 360px;
            object-fit: cover;
            border-radius: 10px;
        }
        .slide .text{
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            /* 白底半透明，黑色文字，能透过文字条看到图片 */
            background-color: rgba(255, 255, 255, 0.7);
            color: #000;
            padding: 12px 16px;
            text-align: center;
            border-radius: 0 0 10px 10px;
            box-sizing: border-box;
        }
        .slide .text h3{ font-size: 20px; color: #000; }
        .slide .text p{ font-size: 14px; color: #000; }
        /* 定义淡入淡出关键帧动画 */
        @keyframes fade{
            0%      { opacity: 0; }
            5%      { opacity: 1; }   /* 0.45秒内淡入 */
            33.33%  { opacity: 1; }   /* 显示3秒 */
            38.33%  { opacity: 0; }   /* 0.45秒内淡出 */
            100%    { opacity: 0; }
        }
    </style>
</head>
<body>
    <h2>王鹏宇的幻灯片</h2>
    <div class="slides">
        <div class="slide">
            <img src="./1.png">
            <div class="text">
                <h3>王鹏宇的图片一</h3>
                <p>第一张图片，上图下文，使用css animation实现轮播</p>
            </div>
        </div>
        <div class="slide">
            <img src="./2.png">
            <div class="text">
                <h3>王鹏宇的图片二</h3>
                <p>第二张图片，三张图轮流显示循环播放</p>
            </div>
        </div>
        <div class="slide">
            <img src="./3.png">
            <div class="text">
                <h3>王鹏宇的图片三</h3>
                <p>第三张图片，纯css动画，不需要javascript</p>
            </div>
        </div>
    </div>
</body>
</html>
