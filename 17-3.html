<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17-3 商品列表页 - 王鹏宇</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
            line-height: 1.6;
            padding: 20px 16px;
        }

        .crx_container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* 页面头部 */
        .crx_header {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            padding: 26px 24px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 24px;
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.3);
        }

        .crx_header_tag {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 3px 14px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .crx_header_title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .crx_header_desc {
            font-size: 14px;
            opacity: 0.9;
        }

        .crx_meta_bar {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
            font-size: 13px;
            background: rgba(0,0,0,0.15);
            padding: 8px 16px;
            border-radius: 8px;
            margin-top: 12px;
        }

        /* 加载状态 */
        .crx_loading {
            text-align: center;
            padding: 60px 20px;
            color: #6366f1;
        }

        .crx_loading_spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: crx_spin 0.8s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes crx_spin {
            to { transform: rotate(360deg); }
        }

        /* 错误提示 */
        .crx_error_box {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            color: #991b1b;
        }

        .crx_error_box h3 { margin-bottom: 8px; }

        .crx_btn_retry {
            margin-top: 14px;
            padding: 8px 20px;
            background: #6366f1;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .crx_btn_retry:hover { background: #4f46e5; }

        /* 商品网格 */
        .crx_product_grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .crx_card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: transform 0.25s, box-shadow 0.25s;
            display: flex;
            flex-direction: column;
        }

        .crx_card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.1);
        }

        .crx_card_img_wrap {
            width: 100%;
            height: 180px;
            background: #f8fafc;
            overflow: hidden;
            position: relative;
        }

        .crx_card_img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .crx_card:hover .crx_card_img {
            transform: scale(1.06);
        }

        .crx_card_category {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(15,23,42,0.7);
            color: #fff;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 6px;
        }

        .crx_card_discount {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #ef4444;
            color: #fff;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 700;
        }

        .crx_card_body {
            padding: 14px 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .crx_card_title {
            font-size: 15px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .crx_card_desc {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 34px;
        }

        .crx_card_info_row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .crx_card_price {
            font-size: 20px;
            font-weight: 800;
            color: #6366f1;
        }

        .crx_card_price small {
            font-size: 13px;
        }

        .crx_card_rating {
            font-size: 13px;
            color: #f59e0b;
            font-weight: 600;
        }

        .crx_btn_detail {
            display: block;
            width: 100%;
            padding: 9px;
            background: #f0f0ff;
            color: #4f46e5;
            border: 1px solid #e0e7ff;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: all 0.2s;
        }

        .crx_btn_detail:hover {
            background: #6366f1;
            color: #fff;
            border-color: #6366f1;
        }

        /* 页脚 */
        .crx_footer {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            padding: 14px 0;
            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="crx_container" id="crx_app">
        <header class="crx_header">
            <span class="crx_header_tag">Web 前端实验 17-3</span>
            <h1 class="crx_header_title">商品列表页 — Fetch API 跨域数据展示</h1>
            <p class="crx_header_desc">使用 fetch() 请求 dummyjson.com 商品接口，点击可跳转到详情页查看完整信息</p>
            <div class="crx_meta_bar">
                <span><strong>姓名：</strong>王鹏宇</span>
                <span><strong>日期：</strong>2026-11-02</span>
                <span><strong>接口：</strong>https://dummyjson.com/products?limit=8</span>
            </div>
        </header>

        <div id="crx_list_container">
            <div class="crx_loading" id="crx_loading">
                <div class="crx_loading_spinner"></div>
                <p>正在从接口加载商品数据，请稍候...</p>
            </div>
        </div>

        <footer class="crx_footer">
            <p>网页设计与制作实验 · 17-3 商品列表页 · 学生：王鹏宇 · 2026-11-02</p>
        </footer>
    </div>

    <script>
        // 页面加载时自动请求商品列表
        window.addEventListener("DOMContentLoaded", function () {
            crx_loadProductList();
        });

        // 请求商品列表
        async function crx_loadProductList() {
            const crx_container = document.getElementById("crx_list_container");
            const crx_apiUrl = "https://dummyjson.com/products?limit=8";

            try {
                const crx_response = await fetch(crx_apiUrl);

                if (!crx_response.ok) {
                    throw new Error("HTTP 状态码: " + crx_response.status);
                }

                const crx_data = await crx_response.json();
                const crx_products = crx_data.products;

                if (!crx_products || crx_products.length === 0) {
                    throw new Error("接口返回的商品列表为空");
                }

                crx_renderProductGrid(crx_products, crx_container);

            } catch (crx_err) {
                crx_container.innerHTML =
                    '<div class="crx_error_box">' +
                    '<h3>❌ 商品列表加载失败</h3>' +
                    '<p>' + crx_err.message + '</p>' +
                    '<button class="crx_btn_retry" onclick="crx_loadProductList()">🔄 重新加载</button>' +
                    '</div>';
            }
        }

        // 渲染商品卡片网格
        function crx_renderProductGrid(crx_products, crx_container) {
            var crx_html = '<div class="crx_product_grid">';

            for (var crx_i = 0; crx_i < crx_products.length; crx_i++) {
                var crx_item = crx_products[crx_i];
                var crx_thumb = crx_item.thumbnail || "";
                var crx_discount = crx_item.discountPercentage
                    ? '<span class="crx_card_discount">-' + Math.round(crx_item.discountPercentage) + '%</span>'
                    : '';

                crx_html +=
                    '<div class="crx_card">' +
                        '<div class="crx_card_img_wrap">' +
                            '<img class="crx_card_img" src="' + crx_thumb + '" alt="' + crx_item.title + '" loading="lazy">' +
                            '<span class="crx_card_category">' + (crx_item.category || '商品') + '</span>' +
                            crx_discount +
                        '</div>' +
                        '<div class="crx_card_body">' +
                            '<div>' +
                                '<h3 class="crx_card_title" title="' + crx_item.title + '">' + crx_item.title + '</h3>' +
                                '<p class="crx_card_desc">' + (crx_item.description || '') + '</p>' +
                            '</div>' +
                            '<div>' +
                                '<div class="crx_card_info_row">' +
                                    '<span class="crx_card_price"><small>$</small>' + crx_item.price + '</span>' +
                                    '<span class="crx_card_rating">⭐ ' + crx_item.rating + '</span>' +
                                '</div>' +
                                '<a class="crx_btn_detail" href="17-3-detail.html?id=' + crx_item.id + '">' +
                                    '🔍 查看详情 (ID: ' + crx_item.id + ')' +
                                '</a>' +
                            '</div>' +
                        '</div>' +
                    '</div>';
            }

            crx_html += '</div>';
            crx_container.innerHTML = crx_html;
        }
    </script>
</body>
</html>
