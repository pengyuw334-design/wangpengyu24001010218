<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            background-color: aliceblue;
            display: flex;
            flex-wrap: wrap;
            margin: 10px;
        }
        .box{
            width: 150px;
            height: 150px;
            margin: 10px;
            border: 1px solid #000;
            background-color: #fff;
            font-size: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.6s;
            box-sizing: border-box;
        }
        .box:first-child:hover{
            background-color: #000;
            color: #fff;
            font-size: 100px;
            border-radius: 30px;
        }
        .box:nth-child(2):hover{
            box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.5);
        }
        .box:nth-child(3):hover{
           text-shadow: 50px 0px 10px rgba(0, 0, 0, 0.5);
        }
        .box:nth-child(4):hover{
           border-radius: 50%;
        }
        .box:nth-child(5){
            background:linear-gradient(#000,#fff);
        }
        .box:nth-of-type(6){
            background:radial-gradient(#fff,#000);
        }
        .box:nth-of-type(6)+.box:hover{
            transform:scale(0.5);
        }
        .box:nth-of-type(8):hover{
            transform:translatex(100px);
        }
        .box:nth-of-type(9):hover{
            transform:rotatex(180deg);
        }
        .box:nth-of-type(10):hover{
            transform: skewx(45deg);
        }
        .box:nth-last-child(2):hover::before{
            content:"#";
            color: red;
        }
        .box:last-child:hover::after{
            content: "王鹏宇";
            color: #fff;
            font-size: 6px;
            display: block;
            width: 40px;
            height: 40px;
            margin: 10px;
            background: #000;
            /* content放在背景里面黑底白字 */


        }
        .box:nth-of-type(3n):hover{
            border: 3px solid red;
        }
        .box:nth-of-type(2n):hover{
            background: #000;
            animation: randomExpand 0.6s ease both;
        }
        @keyframes randomExpand {
            0% {
                transform: scale(1);
            }
            30% {
                transform: scale(1.25) rotate(8deg) translate(8px, -8px);
            }
            60% {
                transform: scale(1.4) rotate(-10deg) translate(-10px, 8px);
            }
            100% {
                transform: scale(1.2) rotate(4deg);
            }
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
        <div class="box">11</div>
        <div class="box">12</div>
    </div>
</body>
</html>
