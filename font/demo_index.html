<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>IconFont 图标索引</title>
  <link rel="stylesheet" href="iconfont.css">
  <script src="iconfont.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .icon { width: 1.5em; height: 1.5em; vertical-align: -0.15em; fill: currentColor; overflow: hidden; }
    .item { display: inline-block; width: 120px; text-align: center; margin: 15px; }
    .item i, .item svg { font-size: 28px; }
  </style>
</head>
<body>
  <h2>iconfont 本地资源包</h2>
  <div class="item"><i class="iconfont icon-shouye"></i><p>icon-shouye</p></div>
  <div class="item"><i class="iconfont icon-fenlei"></i><p>icon-fenlei</p></div>
  <div class="item"><i class="iconfont icon-gouwuche"></i><p>icon-gouwuche</p></div>
  <div class="item"><i class="iconfont icon-wode"></i><p>icon-wode</p></div>
</body>
</html>
