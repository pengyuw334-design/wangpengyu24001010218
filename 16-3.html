    <!-- 引入 font 目录下的 iconfont.css 资源 -->
    <link rel="stylesheet" href="./font/iconfont.css">

    <style>
        /* ========== 基础全局重置 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
            color: #474747;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 1024px;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
        }

        /* ========== 页面主体展示容器 ========== */
        .pixiv-wrapper {
            display: flex;
            background-color: #ffffff;
            min-height: 1024px;
        }

        /* ========== 侧边栏导航主体（严格还原原图 278px 规格与像素排版） ========== */
        .pixiv-sidebar {
            width: 278px;
            min-height: 1024px;
            background-color: #ffffff;
            padding-left: 31px;
            padding-top: 48px;
            padding-right: 18px;
            padding-bottom: 40px;
            user-select: none;
        }

        /* 菜单分组 */
        .nav-group {
            margin-bottom: 56px;
        }

        .nav-group:last-child {
            margin-bottom: 0;
        }

        /* 单个导航菜单项 */
        .nav-item {
            display: flex;
            align-items: center;
            min-height: 28px;
            margin-bottom: 27px;
            cursor: pointer;
            border-radius: 8px;
            transition: color 0.16s ease, background-color 0.16s ease;
        }

        .nav-item:last-child {
            margin-bottom: 0;
        }

        /* 特殊两行换行项（已关注用户的最新作品）微调顶部对齐 */
        .nav-item.is-multiline {
            align-items: flex-start;
            min-height: 42px;
            margin-bottom: 21px;
        }

        .nav-item.is-multiline .nav-icon {
            margin-top: 2px;
        }

        /* 图标容器规范 */
        .nav-icon {
            width: 26px;
            height: 26px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6e6e6e;
            margin-right: 17px;
            transition: color 0.16s ease;
        }

        /* SVG 图标基础规格 */
        .nav-icon .icon-svg {
            width: 24px;
            height: 24px;
            fill: #6e6e6e;
            transition: fill 0.16s ease;
        }

        /* 文字标签规范 */
        .nav-label {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.34;
            color: #474747;
            letter-spacing: 0.01em;
            transition: color 0.16s ease;
        }

        /* 悬停与激活状态交互 */
        .nav-item:hover .nav-icon .icon-svg {
            fill: #1f1f1f;
        }

        .nav-item:hover .nav-label {
            color: #1f1f1f;
        }

        .nav-item.active .nav-icon .icon-svg {
            fill: #0096fa;
        }

        .nav-item.active .nav-label {
            color: #0096fa;
        }
    </style>
</head>

<!-- 交互脚本：支持点击切换选中状态 -->
<script>
    document.querySelectorAll('.nav-item').forEach(function(item) {
        item.addEventListener('click', function() {
            document.querySelectorAll('.nav-item').forEach(function(el) {
                el.classList.remove('active');
            });
            this.classList.add('active');
        });
    });
</script>
