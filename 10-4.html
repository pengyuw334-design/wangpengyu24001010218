<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin: 0; padding: 0;}
        /* 页面最小宽度 320px */
        body{ min-width: 320px; }
        h2{ text-align: center; margin: 20px 0 5px; }
        .tip{ text-align: center; color: #666; margin-bottom: 15px; }
        .list{
            display: flex;
            flex-wrap: wrap;
        }
        .item{
            box-sizing: border-box;
            padding: 10px;
        }
        .item .box{
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 32px;
            border-radius: 10px;
        }
        /* 给8个盒子不同的背景色，方便区分 */
        .item:nth-child(1) .box{ background-color: #ff6b6b; }
        .item:nth-child(2) .box{ background-color: #4ecdc4; }
        .item:nth-child(3) .box{ background-color: #45b7d1; }
        .item:nth-child(4) .box{ background-color: #f9a825; }
        .item:nth-child(5) .box{ background-color: #ab47bc; }
        .item:nth-child(6) .box{ background-color: #66bb6a; }
        .item:nth-child(7) .box{ background-color: #ffa726; }
        .item:nth-child(8) .box{ background-color: #7e57c2; }
        /* 媒体查询1：320px ~ 479px，一行1个 */
        @media screen and (max-width: 479px){
            .item{ width: 100%; }
            .tip::after{ content: "当前一行显示 1 个盒子"; }
        }
        /* 媒体查询2：480px ~ 767px，一行2个 */
        @media screen and (min-width: 480px) and (max-width: 767px){
            .item{ width: 50%; }
            .tip::after{ content: "当前一行显示 2 个盒子"; }
        }
        /* 媒体查询3：768px 以上，一行4个 */
        @media screen and (min-width: 768px){
            .item{ width: 25%; }
            .tip::after{ content: "当前一行显示 4 个盒子"; }
        }
    </style>
</head>
<body>
    <h2>王鹏宇的媒体查询布局</h2>
    <div class="tip"></div>
    <div class="list">
        <div class="item"><div class="box">1</div></div>
        <div class="item"><div class="box">2</div></div>
        <div class="item"><div class="box">3</div></div>
        <div class="item"><div class="box">4</div></div>
        <div class="item"><div class="box">5</div></div>
        <div class="item"><div class="box">6</div></div>
        <div class="item"><div class="box">7</div></div>
        <div class="item"><div class="box">8</div></div>
    </div>
</body>
</html>
