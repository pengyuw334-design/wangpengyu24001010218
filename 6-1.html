<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        .title {
            width: 500px;
            height: 33px;
            line-height: 33px;
            margin: 50px;
        }
        .title h2 {font-size: 14px;
            padding-left: 10px;
           
        }
        .title a {font-size: 14px;
            color: #333;
            text-decoration: none;
            margin-right: 6px;
        }
        .title:first-child {
            display: flex;
            justify-content: space-between;
            border: 1px solid #00f;
        }
        .title:nth-child(2) {
            display: flex;
            border-top: 1px solid #00f;
        }
        .title:nth-child(2) h2 {
            flex-grow:1;
        }
        .title:nth-child(3) {
        position: relative;
        border-bottom: 1px solid #0f0;
        }
        .title:nth-child(3) a {
            position: absolute;
            right: 10px;
            top: 0;
        }
    </style>
</head>
<body>
    
    <div class="title">
        <h2>王鹏宇的标题</h2>
        <a href="#">更多</a>
    </div>

    </div>

</body>
</html>
